
spring.application.name=jobportal

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# H2 Database
spring.datasource.url=jdbc:h2:file:./jobportal;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver


# SQL Initialization
#spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:SQL/jobportal-schema.sql
spring.sql.init.data-locations=classpath:SQL/jobportal-data.sql
spring.jpa.show-sql=true

# Hibernate
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
